<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="content" style="color: oklab(0.5 0.5 0.5);">Test</div>
  <script>
    const originalGetPropertyValue = window.CSSStyleDeclaration.prototype.getPropertyValue;
    window.CSSStyleDeclaration.prototype.getPropertyValue = function(prop) {
      let val = originalGetPropertyValue.call(this, prop);
      if (val && typeof val === 'string') {
        if (val.includes('oklab')) val = 'rgb(128,128,128)';
        if (val.includes('oklch')) val = 'rgb(128,128,128)';
        if (val.includes('color(')) val = 'rgb(128,128,128)';
      }
      return val;
    };
    html2pdf().from(document.getElementById('content')).output('blob').then(()=>console.log('Success')).catch(e=>console.error(e));
  </script>
</body>
</html>
