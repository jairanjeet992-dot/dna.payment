<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="content">
    <button style="outline: 5px solid oklab(0.5 0.5 0.5);">Test</button>
  </div>
  <script>
    function patchWin(win) {
        const origGCS = win.getComputedStyle;
        win.getComputedStyle = function(elt, pseudo) {
            const css = origGCS(elt, pseudo);
            return new Proxy(css, {
                get: function(target, prop) {
                    let val = target[prop];
                    if (typeof val === 'string' && (val.includes('oklab') || val.includes('oklch') || val.includes('color('))) {
                        return 'rgba(0,0,0,0)';
                    }
                    if (typeof val === 'function') {
                        return val.bind(target);
                    }
                    return val;
                }
            });
        };
    }
    patchWin(window);
    
    html2pdf().from(document.getElementById('content')).set({
        html2canvas: {
            onclone: function(doc) {
                if (doc.defaultView) {
                    patchWin(doc.defaultView);
                }
            }
        }
    }).output('blob')
      .then(()=>console.log('Success!'))
      .catch(e=>console.error('Failed!', e));
  </script>
</body>
</html>
